</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><a class="brand" href="#dashboard" onclick="navigate('dashboard');return false"><div class="brand-icon">⌁</div><div class="brand-name">GENETICS<br>LAUNCHPAD<small>UNL · BIOS 201 PREP</small></div></a><nav id="sidenav" class="side-nav"></nav><div class="sidebar-footer"><span class="eyebrow">YOUR MISSION</span><br><b>Build confidence before class.</b><br>Watch. Practice. Retrieve. Repeat.<div style="margin-top:10px">Independent prep · Not affiliated with UNL</div></div></aside><div class="mainwrap"><header class="topbar"><div class="topbrand">⌁ Genetics Launchpad</div><div class="topmeta" id="crumb">UNL / BIOS 201 / OVERVIEW</div><div class="topactions"><button class="btn sm secondary" onclick="shareSite()">↗ Share</button><button class="btn sm secondary" onclick="toggleTheme()" id="themebtn" aria-label="Toggle color theme">◐</button></div></header><main class="container" id="content"></main></div></div><nav class="mobile-nav" id="mobilenav" aria-label="Main navigation"></nav><div id="toast" class="toast is-hidden" role="status" aria-live="polite"></div><script src="./curriculum-upgrades.js"></script><script>const MODULES = [{"title":"DNA, genes & chromosomes","subtitle":"Build your molecular vocabulary","overview":"DNA is the information-carrying molecule; its sequence is organized into genes on chromosomes. Distinguish the physical DNA molecule from the hereditary information it carries.","goals":["Identify the parts of a nucleotide and base-pairing rules","Explain gene, allele, locus, chromosome, and genome","Describe antiparallel 5′→3′ strands and genotype vs phenotype"],"lessons":[{"title":"DNA, chromosomes, genes, and traits","source":"Amoeba Sisters","url":"https://www.youtube.com/watch?v=8m6hHRlKwxY","minutes":9,"yt":"8m6hHRlKwxY","desc":"Start here: short visual introduction."},{"title":"Molecular structure of DNA","source":"Khan Academy","url":"https://www.khanacademy.org/science/biology/dna-as-the-genetic-material/structure-of-dna/v/molecular-structure-of-dna","minutes":13,"yt":null,"desc":"Deeper look at nucleotides and pairing."},{"title":"College genetics lecture collection","source":"MIT OpenCourseWare","url":"https://ocw.mit.edu/courses/res-7-006-7-03x-genetics/","minutes":25,"yt":null,"desc":"Optional advanced college-level reinforcement."}],"tasks":["Sketch one nucleotide and a short antiparallel double helix","Create a concept map: DNA → gene → chromosome → genome","Complete the DNA complement lab below"],"terms":[["Gene","A DNA sequence producing a functional RNA or protein product."],["Allele","A version of a sequence at a specific locus."],["Locus","A genomic position."],["Genome","An organism’s complete genetic material."],["Antiparallel","Two DNA strands oriented in opposite 5′/3′ directions."],["Genotype","An organism’s alleles at one or more loci."]],"quiz":[{"q":"Which bases pair in double-stranded DNA?","choices":["A–G and T–C","A–T and G–C","A–U and G–C","A–C and G–T"],"ans":1,"why":"Complementary DNA pairing is A with T and G with C."},{"q":"What is an allele?","choices":["An alternate form of a gene or DNA sequence","A protein-building organelle","An entire chromosome set","A type of sugar"],"ans":0,"why":"Alleles are versions of sequence at a locus."},{"q":"What does antiparallel mean?","choices":["Both DNA strands run 5′→3′ in the same direction","The strands run in opposite directions","DNA contains RNA","Bases face away from each other"],"ans":1,"why":"One DNA strand runs 5′→3′ while its complement runs 3′→5′."},{"q":"Which best describes a genome?","choices":["A single protein","All of an organism’s genetic material","Only expressed genes","Only autosomes"],"ans":1,"why":"A genome includes coding, noncoding, and other genetic sequences."},{"q":"Which is an example of a phenotype?","choices":["Aa","A DNA codon","Purple flower color","Chromosome 7"],"ans":2,"why":"Phenotype is an observed or measured characteristic."}],"lab":"dna","core":true},{"title":"Replication → RNA → protein","subtitle":"Follow the flow of genetic information","overview":"DNA replication preserves information; transcription produces RNA; translation reads mRNA codons to assemble an amino-acid chain. These are three different processes.","goals":["Contrast replication, transcription and translation","Identify roles of DNA polymerase, RNA polymerase, ribosomes, tRNA","Transcribe a DNA template and translate codons"],"lessons":[{"title":"DNA replication (updated)","source":"Amoeba Sisters","url":"https://www.youtube.com/watch?v=Qqe4thU-os8","minutes":8,"yt":"Qqe4thU-os8","desc":"Replication enzymes and leading/lagging strands."},{"title":"DNA replication, transcription & translation","source":"Khan Academy","url":"https://www.youtube.com/watch?v=6gUY5NoX1Lk","minutes":15,"yt":"6gUY5NoX1Lk","desc":"Overview of the molecular information flow."},{"title":"AP Biology: Gene expression and regulation","source":"Khan Academy","url":"https://www.khanacademy.org/ap-biology/","minutes":15,"yt":null,"desc":"Unit 6 has transcription/translation lessons and practice."}],"tasks":["Draw DNA → pre-mRNA → mature mRNA → protein (eukaryotes)","Label which sequence is a DNA template and where RNA U replaces T","Use the transcription lab to read a DNA template"],"terms":[["Replication","Synthesis of new DNA using a DNA template."],["Transcription","Making RNA from a DNA template."],["Translation","Reading mRNA codons to synthesize a polypeptide."],["Codon","Three mRNA nucleotides specifying an amino acid or stop."],["Anticodon","tRNA triplet that base-pairs with a codon."],["DNA polymerase","Enzyme that synthesizes DNA."]],"quiz":[{"q":"What is the direct product of transcription?","choices":["Protein","RNA","DNA","A chromosome"],"ans":1,"why":"RNA polymerase synthesizes RNA from DNA."},{"q":"Which enzyme synthesizes DNA during replication?","choices":["Ribosome","Ligase only","DNA polymerase","RNA polymerase"],"ans":2,"why":"DNA polymerases add nucleotides to a growing DNA strand."},{"q":"The DNA template 3′-TAC-5′ makes which mRNA codon?","choices":["AUG","TAC","UAC","ATG"],"ans":0,"why":"RNA is complementary and antiparallel; the mRNA is 5′-AUG-3′."},{"q":"Where is the sequence of amino acids specified?","choices":["By mRNA codons during translation","By the lipid membrane","By ATP concentration alone","By the cell wall"],"ans":0,"why":"Ribosomes decode codons to build polypeptides."},{"q":"Which statement is correct?","choices":["Ribosomes synthesize DNA","RNA contains thymine in place of uracil","Translation uses mRNA and tRNA","RNA polymerase makes proteins"],"ans":2,"why":"mRNA supplies codons; tRNAs deliver amino acids in the ribosome."}],"lab":"transcribe","core":true},{"title":"Meiosis, chromosomes & mutations","subtitle":"Understand where variation comes from","overview":"During meiosis, homologous chromosomes separate in meiosis I and sister chromatids separate in meiosis II. Crossing over creates recombinant chromatids; mutations introduce new genetic variants.","goals":["Differentiate mitosis from meiosis I and II","Distinguish homologous chromosomes and sister chromatids","Identify mutation types and consequences"],"lessons":[{"title":"Meiosis (updated)","source":"Amoeba Sisters","url":"https://www.youtube.com/watch?v=VzDMG7ke69g","minutes":8,"yt":"VzDMG7ke69g","desc":"Chromosome mechanics and crossing over."},{"title":"Mutations (updated)","source":"Amoeba Sisters","url":"https://www.youtube.com/watch?v=vl6Vlf2thvI","minutes":8,"yt":"vl6Vlf2thvI","desc":"Substitutions, insertions, deletions and chromosome changes."},{"title":"Khan Academy meiosis lessons","source":"Khan Academy","url":"https://www.khanacademy.org/ap-biology/","minutes":15,"yt":null,"desc":"Unit 5: meiosis and genetic diversity."}],"tasks":["Sketch a 2n=6 cell in meiosis I, meiosis II, and its gametes","Explain why crossing over occurs before homologs separate","Classify 3 mutation examples: substitution, insertion, deletion"],"terms":[["Homologs","Chromosomes carrying the same gene loci, one from each parent."],["Sister chromatids","Identical or near-identical copies formed in S phase."],["Crossing over","Exchange between nonsister chromatids of homologous chromosomes."],["Haploid","One chromosome set (n)."],["Nondisjunction","Failure of chromosomes or chromatids to segregate correctly."],["Frameshift","Reading frame change caused by insertion/deletion not divisible by three."]],"quiz":[{"q":"A diploid cell has 2n=6. A normal gamete has…","choices":["2 chromosomes","3 chromosomes","6 chromosomes","12 chromosomes"],"ans":1,"why":"The gamete is haploid with n=3."},{"q":"Homologous chromosomes normally separate in…","choices":["Mitosis metaphase","Meiosis I","Meiosis II","DNA replication"],"ans":1,"why":"Anaphase I separates homologs; sister chromatids separate in anaphase II."},{"q":"Crossing over generally occurs between…","choices":["Sister chromatids in mitosis","Nonsister chromatids of homologs in prophase I","Two ribosomes","mRNA and DNA"],"ans":1,"why":"Homologs pair in prophase I and exchange corresponding DNA segments."},{"q":"Inserting one nucleotide into a coding region commonly causes…","choices":["A frameshift","No possible change","Automatic chromosome doubling","An extra organelle"],"ans":0,"why":"Single-base indels shift the reading frame unless they occur in special contexts."},{"q":"Independent assortment results primarily from…","choices":["Random orientation of homologous pairs in meiosis I","RNA processing","Transcription","Chromosome duplication alone"],"ans":0,"why":"Different homologous pairs align independently at metaphase I."}],"lab":"none","core":true},{"title":"Mendelian inheritance & probability","subtitle":"Predict genetic crosses with confidence","overview":"Genotypes, gamete probabilities and assumptions about dominance determine expected offspring outcomes. Work problems stepwise instead of memorizing 3:1 or 9:3:3:1 ratios.","goals":["Solve mono- and dihybrid crosses","Use segregation, independent assortment, multiplication and addition rules","Recognize assumptions underlying familiar ratios"],"lessons":[{"title":"Mendelian genetics","source":"Bozeman Science","url":"https://www.youtube.com/watch?v=NWqgZUnJdAY","minutes":16,"yt":"NWqgZUnJdAY","desc":"College-style worked inheritance problems."},{"title":"Mega genetics review","source":"Amoeba Sisters","url":"https://www.youtube.com/watch?v=jLmoJPxihjA","minutes":15,"yt":"jLmoJPxihjA","desc":"Monohybrid, dihybrid, incomplete dominance, sex linkage."},{"title":"Mendelian genetics practice","source":"Khan Academy","url":"https://www.khanacademy.org/science/biology/classical-genetics/variations-on-mendelian-genetics","minutes":15,"yt":null,"desc":"Use worked examples and quizzes."}],"tasks":["Solve 5 Aa × Aa crosses with varying trait conditions","Solve AaBb × AaBb assuming independent assortment","Explore the interactive Punnett square and explain results"],"terms":[["Dominant allele","Allele whose effect appears in the heterozygote under complete dominance."],["Recessive allele","Allele masked in the heterozygote under complete dominance."],["Heterozygote","An individual with two different alleles at a locus."],["Segregation","Two alleles separate into different gametes."],["Independent assortment","Unlinked genes segregate independently."],["Testcross","Cross with a homozygous recessive genotype to infer an unknown genotype."]],"quiz":[{"q":"For Aa × Aa, expected aa frequency is…","choices":["0%","25%","50%","75%"],"ans":1,"why":"The Punnett square is AA, Aa, Aa, aa."},{"q":"For Aa × aa, what proportion of offspring are heterozygous?","choices":["0%","25%","50%","100%"],"ans":2,"why":"Aa produces A and a gametes; aa produces only a."},{"q":"With independent genes, probability of aa AND bb from AaBb × AaBb?","choices":["1/4","1/8","1/16","1/2"],"ans":2,"why":"Multiply 1/4 × 1/4 = 1/16."},{"q":"Which statement describes segregation?","choices":["Alleles from the same gene separate into gametes","Every phenotype is dominant","Genes are expressed equally","Proteins copy DNA"],"ans":0,"why":"Each gamete receives one of the two alleles at a diploid locus."},{"q":"A 9:3:3:1 phenotypic ratio generally assumes…","choices":["Complete dominance and independent assortment","Linked genes and epistasis","No gametes","One parent is haploid"],"ans":0,"why":"The classic ratio depends on those Mendelian conditions."}],"lab":"punnett","core":true},{"title":"Population genetics","subtitle":"Model alleles across generations","overview":"Population genetics tracks how common alleles are. Hardy–Weinberg equilibrium is a reference model with explicit assumptions, not a law that all real populations obey.","goals":["Define p and q and expected genotype frequencies","Solve Hardy–Weinberg calculations","Contrast selection, drift, migration and mutation"],"lessons":[{"title":"Solving Hardy–Weinberg problems","source":"Bozeman Science","url":"https://www.bozemanscience.com/solving-hardy-weinberg-problems","minutes":12,"yt":null,"desc":"Worked example of allele and genotype frequencies."},{"title":"Hardy–Weinberg equation","source":"Bozeman Science","url":"https://www.bozemanscience.com/hardy-weinberg-equation","minutes":12,"yt":null,"desc":"What p, q and 2pq represent."},{"title":"Population genetics explorer","source":"HHMI BioInteractive","url":"https://www.biointeractive.org/classroom-resources/population-genetics-explorer","minutes":20,"yt":null,"desc":"Optional external simulation for evolution forces."}],"tasks":["Derive q from a recessive phenotype rate assuming equilibrium","Explore how p changes p², 2pq, q² in the simulator","Explain five Hardy–Weinberg model assumptions"],"terms":[["Allele frequency","Proportion of gene copies that are a specified allele."],["Hardy–Weinberg","Null model predicting genotype frequencies from allele frequencies."],["Genetic drift","Random shifts in allele frequencies, strongest in small populations."],["Gene flow","Transfer of alleles among populations via migration/reproduction."],["Selection","Differential reproductive success associated with heritable differences."],["Heterozygote frequency","2pq for two alleles under Hardy–Weinberg equilibrium."]],"quiz":[{"q":"Under Hardy–Weinberg, if q²=0.09, what is q?","choices":["0.09","0.30","0.42","0.91"],"ans":1,"why":"q is the square root of 0.09 = 0.30."},{"q":"If p=0.7, the expected heterozygote frequency is…","choices":["0.09","0.21","0.42","0.70"],"ans":2,"why":"2pq = 2×0.7×0.3 = 0.42."},{"q":"Which force is especially prominent in small populations?","choices":["Genetic drift","The central dogma","Translation","Meiosis II"],"ans":0,"why":"Sampling noise has a bigger relative influence in small populations."},{"q":"Which violates Hardy–Weinberg assumptions?","choices":["Very large population","Random mating","Strong selection at the locus","No migration"],"ans":2,"why":"Selection changes survival/reproduction by genotype."},{"q":"If p=0.6 and q=0.4, what is expected aa?","choices":["0.16","0.24","0.36","0.48"],"ans":0,"why":"q² = (0.4)² = 0.16."}],"lab":"hardy","core":true},{"title":"Non-Mendelian inheritance & pedigrees","subtitle":"Read more realistic inheritance patterns","overview":"Simple dominance is a useful starting point. Actual traits may be sex-linked, codominant, polygenic or influenced by environment; pedigrees help infer patterns from family histories.","goals":["Read basic pedigrees","Differentiate incomplete dominance, codominance and polygenic traits","Solve an X-linked recessive probability problem"],"lessons":[{"title":"Advanced genetics","source":"Bozeman Science","url":"https://www.youtube.com/watch?v=YoEgUqHOcbc","minutes":15,"yt":"YoEgUqHOcbc","desc":"Polygenic, sex-linked and linked genes."},{"title":"Mega genetics review: non-Mendelian sections","source":"Amoeba Sisters","url":"https://www.youtube.com/watch?v=jLmoJPxihjA","minutes":15,"yt":"jLmoJPxihjA","desc":"At 6:18 onward: codominance, sex linkage, pedigrees."},{"title":"Non-Mendelian & pedigree lessons","source":"Khan Academy","url":"https://www.khanacademy.org/ap-biology/","minutes":20,"yt":null,"desc":"Unit 5 includes pedigrees and X-linked inheritance."}],"tasks":["Interpret three generations of a sample pedigree","Compare AB blood group with incomplete dominance","Calculate X-linked recessive outcomes by child sex"],"terms":[["Pedigree","Diagram of traits across generations in a family."],["X-linked recessive","Recessive allele on X chromosome; outcomes depend on sex chromosome makeup."],["Incomplete dominance","Heterozygote phenotype intermediate between homozygotes."],["Codominance","Both alleles have observable effects in a heterozygote."],["Epistasis","An allele at one locus modifies expression at another."],["Heritability","Population-level proportion of trait variance attributable to genetic differences in a specified setting."]],"quiz":[{"q":"In ABO blood groups, IA and IB demonstrate…","choices":["Codominance","Complete recessiveness","Mitochondrial inheritance","Linkage"],"ans":0,"why":"The AB phenotype expresses both A and B antigens."},{"q":"A carrier mother and unaffected father have an X-linked recessive trait. Proportion of sons expected affected?","choices":["0%","25%","50%","100%"],"ans":2,"why":"Sons get Y from the father and one of the two maternal X alleles."},{"q":"A heterozygote has an intermediate phenotype. This is…","choices":["Codominance","Incomplete dominance","Independent assortment","Genetic drift"],"ans":1,"why":"The heterozygote is intermediate under incomplete dominance."},{"q":"High heritability means…","choices":["The trait cannot be changed by environment","Genes explain a high fraction of trait variation in that population/environment","An individual is genetically fixed","Every relative has identical traits"],"ans":1,"why":"Heritability is a population-specific statistic, not an individual destiny."},{"q":"A parent-to-son X-linked recessive transmission from the father is…","choices":["Expected in every son","Not a direct paternal X transmission","Proof of dominance","Evidence of mitochondrial genes"],"ans":1,"why":"A typical father transmits a Y, rather than his X, to sons."}],"lab":"none","core":true},{"title":"Linkage, recombination & maps","subtitle":"Turn offspring counts into chromosome distances","overview":"Nearby loci tend to travel together. Recombinant offspring reveal crossovers, allowing approximate genetic map distances to be inferred.","goals":["Distinguish parental from recombinant classes","Compute recombination frequency","Explain limits of map distance estimates"],"lessons":[{"title":"Gene mapping","source":"Khan Academy India","url":"https://www.youtube.com/watch?v=j3dwnTRMitQ","minutes":12,"yt":"j3dwnTRMitQ","desc":"Worked linkage and recombination mapping."},{"title":"Linkage and recombination","source":"Khan Academy","url":"https://www.khanacademy.org/science/biology/classical-genetics/linkage-and-recombination","minutes":15,"yt":null,"desc":"Why some crosses deviate from independent assortment."},{"title":"MIT genetics: recombination and linkage","source":"MIT OpenCourseWare","url":"https://ocw.mit.edu/courses/res-7-006-7-03x-genetics/","minutes":25,"yt":null,"desc":"Optional university-level problem sets and videos."}],"tasks":["Compute recombination frequency from a 1,000-offspring count","Describe parental and recombinant gametes in a testcross","Explain why observed recombination does not exceed 50%"],"terms":[["Linked genes","Genes close enough on one chromosome to not assort independently."],["Recombination","Production of new allele combinations through crossing over or other mechanisms."],["Map unit","One centimorgan approximates 1% observed recombination for small distances."],["Parental class","Offspring allele combination matching parental chromosome haplotypes."],["Recombinant class","Offspring haplotype differing because of recombination."],["Testcross","Often used to directly reveal gamete types."]],"quiz":[{"q":"82 recombinant offspring among 1,000 indicates…","choices":["0.82 cM","8.2 cM","82 cM","820 cM"],"ans":1,"why":"82/1000 × 100 = 8.2% = approximately 8.2 cM."},{"q":"A recombination frequency close to 50% suggests…","choices":["Complete linkage","Genes assort as if unlinked","The genes are identical","No meiosis"],"ans":1,"why":"Unlinked or very widely separated loci approach 50% recombination."},{"q":"Which pair is most likely tightly linked?","choices":["2% recombination","25% recombination","49% recombination","50% recombination"],"ans":0,"why":"Lower recombination indicates closer linkage, in a simple mapping context."},{"q":"For two genes, which count is used in recombination frequency?","choices":["Only parental individuals","Recombinant offspring divided by all scored offspring","Number of all chromosomes","Number of proteins"],"ans":1,"why":"Recombination fraction is recombinant offspring / total offspring."},{"q":"Why can mapping underestimate long distances?","choices":["Double crossovers can restore parental arrangements","RNA always mutates","All genes are dominant","There are no meioses"],"ans":0,"why":"Multiple crossovers can mask recombination events."}],"lab":"mapping","core":true},{"title":"Gene regulation, genomics & bioinformatics","subtitle":"Connect genes to modern data analysis","overview":"Cells do not express every gene all the time. Regulation, sequencing, and bioinformatics reveal how genetic instructions are used, compared, and interpreted.","goals":["Explain gene expression control at transcription and beyond","Describe an operon and basics of the lac system","Describe short-read genome assembly and association vs causation"],"lessons":[{"title":"Gene expression and regulation","source":"Amoeba Sisters","url":"https://www.youtube.com/watch?v=ebIpkw3XapE","minutes":9,"yt":"ebIpkw3XapE","desc":"Accessible modern introduction to regulation."},{"title":"Gene regulation: lac and trp operons","source":"Bozeman Science","url":"https://www.bozemanscience.com/031-gene-regulation","minutes":14,"yt":null,"desc":"More detailed bacterial and eukaryotic control."},{"title":"Human genome sequencing","source":"HHMI BioInteractive","url":"https://www.biointeractive.org/classroom-resources/human-genome-sequencing","minutes":8,"yt":null,"desc":"DNA fragments, overlap and computational assembly."},{"title":"Shotgun sequencing","source":"HHMI BioInteractive","url":"https://www.biointeractive.org/classroom-resources/shotgun-sequencing","minutes":8,"yt":null,"desc":"Extra short genome-assembly animation."}],"tasks":["Sketch an operon with promoter, operator and structural genes","Describe how overlapping reads can reconstruct a longer sequence","Explain why an associated SNP is not automatically causal"],"terms":[["Gene regulation","Control over when, where, and how much gene product is made."],["Operon","Cluster of bacterial genes regulated by a shared promoter."],["Promoter","DNA region where transcription machinery initiates transcription."],["Genome sequencing","Determining nucleotide order across a genome."],["Read mapping","Aligning sequence reads to a reference genome."],["GWAS","Genome-wide association study identifying statistical variant–trait associations."]],"quiz":[{"q":"The lac operon is a model of…","choices":["Regulation of bacterial transcription","DNA replication in mammals","Chromosome segregation","Ribosome duplication"],"ans":0,"why":"The lac system responds to nutrient availability to regulate transcription."},{"q":"A promoter is…","choices":["A regulatory DNA sequence for transcription initiation","An amino acid","A chromosome spindle","A type of RNA"],"ans":0,"why":"Promoters help recruit transcription machinery."},{"q":"Overlapping sequence fragments are useful because they…","choices":["Allow reconstructing the original DNA order","Guarantee every mutation is beneficial","Stop all transcription","Prove every trait is genetic"],"ans":0,"why":"Shared overlapping segments provide information for assembly."},{"q":"A SNP associated with disease in a GWAS…","choices":["Is necessarily causal","May be linked to a causal variant","Always changes a protein","Is automatically dominant"],"ans":1,"why":"Association can reflect linkage disequilibrium and other confounding."},{"q":"Which layer can regulate eukaryotic gene expression?","choices":["Only translation","Only DNA replication","Transcription, RNA processing, translation and protein stability","None of these"],"ans":2,"why":"Eukaryotic gene expression can be controlled at many stages."}],"lab":"none","core":false}];
</script><script>'use strict';
const KEY='bios201_launchpad_progress_v1';
const extra=window.BIOS_UPGRADES||{quizzes:[],examples:[],videos:[]};extra.videos.forEach(([i,j,l])=>{if(MODULES[i]?.lessons[j])MODULES[i].lessons[j]=l});MODULES.forEach((m,i)=>{m.quiz=[...m.quiz,...(extra.quizzes[i]||[])];m.examples=extra.examples[i]||[]});
const DEFAULT={version:2,quizLast:{},watched:{},tasks:{},best:{},attempts:{},flash:{},notes:{},theme:'dark',started:'',sessions:[]};
function loadState(){try{const raw=localStorage.getItem(KEY);const x=raw?JSON.parse(raw):{};return {...DEFAULT,...x,watched:x.watched||{},tasks:x.tasks||{},best:x.best||{},attempts:x.attempts||{},quizLast:x.quizLast||{},flash:x.flash||{},notes:x.notes||{},sessions:x.sessions||[]};}catch(e){return structuredClone(DEFAULT)}}
let state=loadState(),quizSet=[],flashResults=[],page='dashboard',week=0,tab='learn',answers={},graded=false,player='',deckScope='due',deck=[],deckPos=0,flipped=false,toastTimer=null,dnaInput='TACGGACTT',punnettA='Aa',punnettB='Aa',hardyP=.7,mapR=82,mapTotal=1000;
const nav=[['dashboard','▦','Dashboard'],['modules','▤','Curriculum'],['flashcards','◫','Flashcards'],['labs','⌘','Practice labs'],['resources','☰','Resources'],['settings','⚙','Settings']];
const h=(s)=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const round=(v)=>Math.round(v);const k=(i,j)=>i+':'+j;const e=(id)=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(err){console.warn('Local storage unavailable',err)}}
function today(){return new Date().toLocaleDateString('en-CA')}
function notify(t){const el=e('toast');if(!el)return;el.textContent=t;el.classList.remove('is-hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('is-hidden'),3100)}
function moduleProgress(i){const m=MODULES[i],vid=m.lessons.filter((_,j)=>state.watched[k(i,j)]).length,ts=m.tasks.filter((_,j)=>state.tasks[k(i,j)]).length,passed=(state.best[i]||0)>=80;return {vid,ts,passed,pct:Math.round(100*(vid+ts+(passed?1:0))/(m.lessons.length+m.tasks.length+1)),complete:vid===m.lessons.length&&ts===m.tasks.length&&passed}}
function overall(){return Math.round(MODULES.reduce((s,_,i)=>s+moduleProgress(i).pct,0)/MODULES.length)}
function completed(){return MODULES.filter((_,i)=>moduleProgress(i).complete).length}
function avgBest(){const grades=Object.values(state.best).map(Number);return grades.length?round(grades.reduce((s,v)=>s+v,0)/grades.length):0}
function countDone(t){return Object.values(t).filter(Boolean).length}
function drawNav(){const active=page==='module'?'modules':page; e('sidenav').innerHTML=nav.map(([id,emoji,title])=>`<button class="navbutton ${active===id?'active':''}" onclick="navigate('${id}')"><span class="nav-emoji">${emoji}</span>${title}</button>`).join('');e('mobilenav').innerHTML=nav.map(([id,emoji,title])=>`<button class="${active===id?'active':''}" onclick="navigate('${id}')"><span>${emoji}</span>${title.replace('Practice ','')}</button>`).join('');}
function navigate(to,i=week,t='learn'){if(to==='module'&&(i!==week||t==='quiz'))quizSet=[];page=to;week=i;tab=t;graded=false;answers={};player='';if(to==='flashcards')initDeck();history.replaceState(null,'',to==='module'?'#week-'+(i+1)+'-'+t:'#'+to);render();scrollTo({top:0,behavior:'instant'})}
function goTab(t){if(t==='quiz')quizSet=[];tab=t;graded=false;answers={};player='';history.replaceState(null,'','#week-'+(week+1)+'-'+t);render();}
function syncHash(){quizSet=[];let hash=location.hash.slice(1),m=hash.match(/^week-(\d+)(?:-(\w+))?$/);if(m){page='module';week=Math.max(0,Math.min(7,Number(m[1])-1));tab=['learn','practice','quiz','notes'].includes(m[2])?m[2]:'learn'}else if(nav.some(n=>n[0]===hash)){page=hash}if(page==='flashcards')initDeck();render()}
function btn(label,call=''){return `<button class="btn" onclick="${call}">${label}</button>`}
function gridWeek(i){const m=MODULES[i],p=moduleProgress(i);return `<article class="weekcard"><div class="row between wrap"><span class="weeknum">WEEK ${i+1}</span><span class="pill ${p.complete?'good':(m.core?'warm':'')}">${p.complete?'✓ Mastered':m.core?'Foundation':'Extension'}</span></div><div><h3>${h(m.title)}</h3><p>${h(m.subtitle)}</p></div><div><div class="row between small muted" style="margin-bottom:7px"><span>Mastery progress</span><b>${p.pct}%</b></div><div class="progress"><i style="width:${p.pct}%"></i></div></div><div class="row between wrap"><span class="small muted">${p.vid}/${m.lessons.length} videos · Quiz ${state.best[i]===undefined?'—':state.best[i]+'%'}</span><button class="btn sm secondary" onclick="navigate('module',${i})">${p.pct?'Continue':'Start week'} →</button></div></article>`}
function dashboard(){const next=Math.max(0,MODULES.findIndex((_,i)=>!moduleProgress(i).complete));const avg=avgBest(),percent=overall();return `<section class="hero"><span class="eyebrow" style="color:#85e9d3">YOUR GENETICS PREP PATH</span><h1>Get ahead of <span style="color:#85ead9">BIOS 201.</span></h1><p>Eight weeks of curated videos, real genetics problems, spaced-repetition flashcards and interactive labs. Learn the mechanisms, not just the vocabulary.</p><div class="toolbar"><button class="btn" onclick="navigate('module',${next})">${percent?'Resume learning':'Start Week 1'} →</button><button class="btn secondary" onclick="navigate('modules')">Explore curriculum</button></div></section><section class="stats grid"><div class="stat"><span>COURSE PROGRESS</span><strong>${percent}%</strong><div class="progress" style="margin-top:8px"><i style="width:${percent}%"></i></div></div><div class="stat"><span>MODULES MASTERED</span><strong>${completed()} <small class="muted">/ 8</small></strong></div><div class="stat"><span>BEST QUIZ AVERAGE</span><strong>${avg?avg+'%':'—'}</strong></div><div class="stat"><span>QUIZ BANK</span><strong>${MODULES.reduce((n,m)=>n+m.quiz.length,0)} <small class="muted">questions</small></strong></div></section><section class="section"><div class="section-head"><div><span class="eyebrow">NEXT UP</span><h2>Continue where you left off</h2></div></div><div class="panel"><div class="row between wrap"><div><span class="pill">WEEK ${next+1}</span><h2 style="margin:10px 0 6px">${h(MODULES[next].title)}</h2><p style="max-width:600px">${h(MODULES[next].overview)}</p></div><button class="btn" onclick="navigate('module',${next})">Open module →</button></div><div class="progress"><i style="width:${moduleProgress(next).pct}%"></i></div><div class="small muted" style="margin-top:8px">${moduleProgress(next).pct}% complete · Mastery requires videos, practice tasks, and ≥80% on the quiz.</div></div></section><section class="section"><div class="section-head"><div><span class="eyebrow">8-WEEK ROADMAP</span><h2>Your modules</h2></div><button class="btn secondary sm" onclick="navigate('modules')">View all →</button></div><div class="grid weekgrid">${MODULES.slice(0,4).map((_,i)=>gridWeek(i)).join('')}</div></section><section class="section"><div class="panel soft"><h3>How to get the most from this</h3><div class="threecol small muted"><div><b class="accent">01 · Watch</b><br>Open each lesson and annotate a key diagram.</div><div><b class="accent">02 · Apply</b><br>Finish practice exercises and use a lab.</div><div><b class="accent">03 · Recall</b><br>Score ≥80% on your quiz and revisit flashcards.</div></div></div></section>${footnote()}`}
function modulesPage(){return `<div class="row between wrap"><div><span class="eyebrow">THE PLAN</span><h1 style="margin:8px 0">Your 8-week curriculum</h1><p class="maxtext">Budget about 3–4 hours each week. Weeks 1–4 are the prerequisite foundations; Weeks 5–8 broaden into population, linkage and genomics.</p></div><span class="pill good">${completed()}/8 mastered</span></div><div class="grid weekgrid" style="margin-top:22px">${MODULES.map((_,i)=>gridWeek(i)).join('')}</div>${footnote()}`}
function modulePage(){const m=MODULES[week],p=moduleProgress(week);let inner=tab==='learn'?learnTab(m):tab==='practice'?practiceTab(m):tab==='quiz'?quizTab(m):notesTab(m);return `<button class="btn sm secondary" onclick="navigate('modules')" style="margin-bottom:20px">← All modules</button><div class="modulehero"><div><div class="row wrap"><span class="weeknum">WEEK ${week+1} / 8</span><span class="pill ${m.core?'warm':''}">${m.core?'Core foundation':'Advanced preview'}</span>${p.complete?'<span class="pill good">✓ Mastered</span>':''}</div><h1>${h(m.title)}</h1><p>${h(m.overview)}</p><div class="toolbar small muted"><span>▶ ${p.vid}/${m.lessons.length} lessons</span><span>☑ ${p.ts}/${m.tasks.length} tasks</span><span>◆ Best quiz: ${state.best[week]===undefined?'not attempted':state.best[week]+'%'}</span></div></div><div class="ring" style="--amount:${p.pct}%"><div><div><strong>${p.pct}%</strong><small>complete</small></div></div></div></div><div class="tabs" role="tablist">${[['learn','▶ Watch & learn'],['practice','✎ Practice'],['quiz','◎ Quiz'],['notes','☷ Notes']].map(([id,txt])=>`<button class="tab ${tab===id?'active':''}" role="tab" aria-selected="${tab===id}" onclick="goTab('${id}')">${txt}</button>`).join('')}</div>${inner}<div class="row between wrap" style="margin-top:29px"><button class="btn sm secondary" onclick="navigate('module',${Math.max(0,week-1)})" ${week===0?'disabled':''}>← Previous</button><button class="btn sm" onclick="navigate('module',${Math.min(7,week+1)})" ${week===7?'disabled':''}>Next week →</button></div>${footnote()}`}
function learnTab(m){return `<div class="grid" style="gap:22px"><section class="panel"><span class="eyebrow">LEARNING TARGETS</span><h2 style="margin:9px 0">What you'll be able to do</h2><ol class="goal-list">${m.goals.map(x=>`<li>${h(x)}</li>`).join('')}</ol></section><section class="panel"><div class="section-head"><div><span class="eyebrow">CURATED VIDEO PLAYLIST</span><h2>Watch in order</h2></div><span class="pill">${m.lessons.reduce((a,b)=>a+b.minutes,0)} min of video</span></div><p>Videos open from their original publishers; select <b>Play here</b> for YouTube lessons. Check off each video after you finish.</p>${m.lessons.map((l,j)=>`<article class="lessonrow"><div class="video-thumb">${l.yt?'▶':'↗'}</div><div><h3>${h(l.title)}</h3><p>${h(l.source)} · ~${l.minutes} min${l.desc?' · '+h(l.desc):''}</p></div><div class="lessonlinks">${l.yt?`<button class="btn sm secondary" onclick="playVideo(${j})">Play here</button>`:''}<a class="btn sm ghost" href="${h(l.url)}" target="_blank" rel="noopener noreferrer">Open ↗</a><label class="row small muted" style="cursor:pointer;gap:5px"><input type="checkbox" ${state.watched[k(week,j)]?'checked':''} onchange="toggleWatched(${j},this.checked)"> Done</label></div></article>`).join('')}<div id="playerwrap">${videoPlayer(m)}</div></section><section class="panel soft"><span class="eyebrow">KEY IDEA</span><h3 style="margin:8px 0">Before you move on</h3><p>${h(m.subtitle)}. Be ready to explain the idea out loud without looking at your notes.</p><button class="btn" onclick="goTab('practice')">Go to exercises →</button></section></div>`}
function videoPlayer(m){if(player==='')return '';let l=m.lessons[Number(player)];if(!l||!l.yt)return '';return `<div class="divider"></div><h3>Now playing: ${h(l.title)}</h3><iframe class="player" title="${h(l.title)}" src="https://www.youtube-nocookie.com/embed/${l.yt}?rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe><div class="small muted">If the embed is unavailable in your browser, <a href="${h(l.url)}" target="_blank" rel="noopener noreferrer">watch on YouTube ↗</a>.</div>`}
function playVideo(j){player=String(j);e('playerwrap').innerHTML=videoPlayer(MODULES[week]);e('playerwrap').scrollIntoView({behavior:'smooth',block:'center'})}
function toggleWatched(j,value){state.watched[k(week,j)]=value;save();notify(value?'Video marked complete':'Video unchecked');render()}
function toggleTask(j,value){state.tasks[k(week,j)]=value;save();render()}
function workedExamples(m){return '<section class="panel"><span class="eyebrow">WORKED EXAMPLES</span><h2>Learn the steps before practicing</h2><p>Try each problem first, then open the solution to compare your reasoning.</p>'+(m.examples||[]).map(x=>'<details style="padding:14px 0;border-top:1px solid var(--line)"><summary style="cursor:pointer;font-weight:750">'+h(x.title)+'</summary><p>'+h(x.question)+'</p><ol>'+x.steps.map(s=>'<li>'+h(s)+'</li>').join('')+'</ol></details>').join('')+'</section>'}
function practiceTab(m){return `<div class="grid" style="gap:20px">${workedExamples(m)}<section class="panel"><span class="eyebrow">ACTIVE RECALL</span><h2 style="margin:10px 0">Your practice checklist</h2><p>Do these independently, preferably on paper. Check them only after you can explain each answer.</p>${m.tasks.map((t,j)=>`<label class="checkline ${state.tasks[k(week,j)]?'checked':''}"><input type="checkbox" ${state.tasks[k(week,j)]?'checked':''} onchange="toggleTask(${j},this.checked)"><span>${h(t)}</span></label>`).join('')}</section>${m.lab!=='none'?`<section class="panel"><span class="eyebrow">INTERACTIVE LAB</span><h2 style="margin:9px 0">${h(labName(m.lab))}</h2>${labContent(m.lab)}</section>`:''}<section class="panel soft"><h3>Turn recall into retention</h3><p>Practice the vocabulary for this module, then take its 5-question scored check.</p><div class="toolbar"><button class="btn secondary" onclick="openFlashcards(${week})">Study this week's cards →</button><button class="btn" onclick="goTab('quiz')">Take module quiz →</button></div></section></div>`}
function selectAnswer(j,v){if(graded)return;answers[j]=v;}
function shuffleArray(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quizQuestions(m){if(quizSet.length)return quizSet;const previous=state.quizLast?.[week]||[];const pool=m.quiz.map((q,i)=>({q,i}));const unseen=shuffleArray(pool.filter(x=>!previous.includes(x.i)));const seen=shuffleArray(pool.filter(x=>previous.includes(x.i)));quizSet=[...unseen,...seen].slice(0,5).map(({q,i})=>{const opts=shuffleArray(q.choices.map((v,j)=>({v,j})));return {...q,sourceIndex:i,choices:opts.map(o=>o.v),ans:opts.findIndex(o=>o.j===q.ans)}});return quizSet}
function quizTab(m){const questions=quizQuestions(m);const best=state.best[week];let score=graded?Math.round(100*questions.filter((q,j)=>answers[j]===q.ans).length/questions.length):null;return `<div class="panel"><div class="row between wrap"><div><span class="eyebrow">KNOWLEDGE CHECK</span><h2 style="margin:8px 0">Week ${week+1} quiz</h2><p>5 randomized questions from ${m.quiz.length} · One answer each · Explanations revealed when you grade.</p></div><span class="pill ${best>=80?'good':''}">Best: ${best===undefined?'—':best+'%'}</span></div>${graded?`<div class="notice" style="margin:20px 0"><div class="score ${score>=80?'accent':''}">${score}%</div><b>${score>=80?'✓ You passed the mastery threshold!':'Keep practicing. Mastery starts at 80%.'}</b><div class="small muted">${questions.filter((q,j)=>answers[j]===q.ans).length} of ${questions.length} correct. Review the explanations below before retrying.</div></div>`:''}<div id="question-list">${questions.map((q,j)=>`<div class="quizquestion"><h3>${j+1}. ${h(q.q)}</h3>${q.choices.map((choice,x)=>`<label class="opt ${graded?(x===q.ans?'correct':answers[j]===x?'wrong':''):''}"><input type="radio" name="q${j}" value="${x}" ${answers[j]===x?'checked':''} ${graded?'disabled':''} onchange="selectAnswer(${j},${x})"><span>${h(choice)}</span></label>`).join('')}${graded?`<div class="explanation"><b>${answers[j]===q.ans?'Correct.':'Explanation:'}</b> ${h(q.why)}</div>`:''}</div>`).join('')}</div><div class="toolbar">${graded?`<button class="btn" onclick="retryQuiz()">Try again ↻</button><button class="btn secondary" onclick="goTab('notes')">Review notes →</button>`:`<button class="btn" onclick="gradeQuiz()">Grade my answers →</button>`}</div></div>`}
function gradeQuiz(){const questions=quizQuestions(MODULES[week]);if(Object.keys(answers).length<questions.length){notify('Please answer all 5 questions first.');return}const m=MODULES[week];let score=Math.round(100*questions.filter((q,j)=>answers[j]===q.ans).length/questions.length);state.quizLast=state.quizLast||{};state.quizLast[week]=questions.map(q=>q.sourceIndex);state.best[week]=Math.max(Number(state.best[week])||0,score);state.attempts[week]=(state.attempts[week]||0)+1;state.sessions.push({week:week+1,score,date:new Date().toISOString()});save();graded=true;render();e('question-list')?.scrollIntoView({block:'start',behavior:'smooth'})}
function retryQuiz(){answers={};graded=false;quizSet=[];render()}
function notesTab(m){return `<div class="panel"><span class="eyebrow">YOUR PRIVATE STUDY JOURNAL</span><h2 style="margin:8px 0">Week ${week+1} notes</h2><p>Explain ideas in your own words. Notes save automatically <b>on this device</b> as you type.</p><textarea aria-label="Module study notes" placeholder="Key concepts, diagrams to redraw, questions to ask in lecture…" oninput="saveNote(this.value)">${h(state.notes[week]||'')}</textarea><div class="small muted" style="margin-top:12px">Writing prompt: How does ${h(m.title.toLowerCase())} connect to what you studied last week?</div></div>`}
function saveNote(value){state.notes[week]=value;save()}
function labName(type){return ({dna:'DNA complement builder',transcribe:'Transcription workbench',punnett:'Punnett square explorer',hardy:'Hardy–Weinberg simulator',mapping:'Recombination map calculator'})[type]||'Practice lab'}
function labsPage(){return `<span class="eyebrow">HANDS-ON PRACTICE</span><h1 style="margin:8px 0">Interactive genetics labs</h1><p class="maxtext">Change the inputs and observe how the biology changes. These five exercises run directly in your browser.</p><div class="grid" style="gap:18px;margin-top:22px">${['dna','transcribe','punnett','hardy','mapping'].map(type=>`<section class="panel"><div class="row between wrap"><h2 style="margin:0">${labName(type)}</h2><span class="pill">${type==='hardy'?'Population genetics':type==='mapping'?'Linkage':'Molecular / classical'}</span></div><div style="margin-top:18px">${labContent(type)}</div></section>`).join('')}</div>${footnote()}`}
function labContent(type){if(type==='dna'||type==='transcribe'){return `<p>${type==='dna'?'Enter a DNA strand written 5′→3′ and see its complementary, antiparallel strand.':'Enter a DNA template written 3′→5′ and see the complementary mRNA synthesized 5′→3′.'}</p><div class="formfield"><label for="dna${type}">DNA sequence (A, C, G, T only)</label><input id="dna${type}" type="text" value="${h(dnaInput)}" spellcheck="false" autocapitalize="characters" oninput="updateDNA(this.value)" placeholder="TACGGACTT"></div><div id="dna-result-${type}">${dnaResult(type)}</div>`}if(type==='punnett'){return `<p>Select both parental genotypes for one autosomal gene and observe expected offspring genotypes.</p><div class="twocol"><div class="formfield"><label>Parent 1</label><select onchange="punnettA=this.value;drawLabs()">${['AA','Aa','aa'].map(g=>`<option ${g===punnettA?'selected':''}>${g}</option>`).join('')}</select></div><div class="formfield"><label>Parent 2</label><select onchange="punnettB=this.value;drawLabs()">${['AA','Aa','aa'].map(g=>`<option ${g===punnettB?'selected':''}>${g}</option>`).join('')}</select></div></div><div id="punnett-result">${punnettResult()}</div>`}if(type==='hardy'){return `<p>Adjust allele <strong>A</strong> frequency (<strong>p</strong>). Under Hardy–Weinberg assumptions, q=1−p and expected genotype frequencies are p², 2pq, and q².</p><div class="formfield"><label for="hardyslider">Allele frequency p: <b id="hardyval">${hardyP.toFixed(2)}</b></label><input type="range" id="hardyslider" min="0" max="100" step="1" value="${Math.round(hardyP*100)}" oninput="hardyP=+this.value/100;drawHardy()"></div><div id="hardy-result">${hardyResult()}</div>`}if(type==='mapping'){return `<p>Enter recombinant and total offspring counts from a mapping cross. Recombination (%) approximates genetic distance in cM for short distances.</p><div class="twocol"><div class="formfield"><label>Recombinant offspring</label><input type="number" min="0" value="${mapR}" oninput="mapR=Number(this.value);drawMap()"></div><div class="formfield"><label>Total offspring</label><input type="number" min="1" value="${mapTotal}" oninput="mapTotal=Number(this.value);drawMap()"></div></div><div id="map-result">${mapResult()}</div>`}return ''}
const dnaMap={A:'T',T:'A',C:'G',G:'C'},rnaMap={A:'U',T:'A',C:'G',G:'C'};
function dnaResult(type){const seq=dnaInput.toUpperCase().replace(/\s+/g,'');if(!seq||/[^ATCG]/.test(seq))return '<div class="notice">Enter a DNA sequence containing only A, C, G and T.</div>';let comp=[...seq].map(s=>dnaMap[s]).join(''),rna=[...seq].map(s=>rnaMap[s]).join('');return type==='dna'?`<div class="panel soft"><div class="formula" style="overflow-wrap:anywhere">5′–${h(seq)}–3′</div><div class="formula" style="color:var(--accent2);overflow-wrap:anywhere">3′–${comp}–5′</div><div class="divider"></div><div class="small muted">Reverse complement written 5′→3′: <b>${comp.split('').reverse().join('')}</b></div></div>`:`<div class="panel soft"><span class="small muted">DNA template (3′→5′)</span><div class="formula" style="overflow-wrap:anywhere">3′–${h(seq)}–5′</div><span class="small muted">mRNA (5′→3′)</span><div class="formula" style="color:var(--accent2);overflow-wrap:anywhere">5′–${rna}–3′</div><div class="small muted" style="margin-top:10px">Triplets: ${rna.match(/.{1,3}/g).join(' · ')}${rna.length%3?' (last triplet incomplete)':''}. Translation requires a codon reading frame.</div></div>`}
function updateDNA(v){dnaInput=v;document.querySelectorAll('[id^="dna-result-"]').forEach(el=>{el.innerHTML=dnaResult(el.id.slice('dna-result-'.length))});document.querySelectorAll('[id^="dnadna"],[id^="dnatranscribe"]').forEach(el=>{if(document.activeElement!==el)el.value=v})}
function punnettResult(){const a=[...punnettA],b=[...punnettB],combine=(x,y)=>[x,y].sort((l,r)=>l==='A'?-1:r==='A'?1:0).join('');const cells=[combine(a[0],b[0]),combine(a[0],b[1]),combine(a[1],b[0]),combine(a[1],b[1])],count=g=>cells.filter(s=>s===g).length*25;return `<div class="gametes" aria-label="Punnett square"><div>×</div><div>${b[0]}</div><div>${b[1]}</div><div>${a[0]}</div><div class="cell">${cells[0]}</div><div class="cell">${cells[1]}</div><div>${a[1]}</div><div class="cell">${cells[2]}</div><div class="cell">${cells[3]}</div></div><div class="threecol" style="margin-top:15px">${['AA','Aa','aa'].map(g=>`<div class="genotypebox">${g}<div class="small muted">${count(g)}%</div></div>`).join('')}</div><p class="small" style="margin-top:13px">Assumes equal gamete frequencies, Mendelian segregation and no viability differences. With complete A dominance, dominant phenotype = ${count('AA')+count('Aa')}%.</p>`}
function drawLabs(){document.querySelectorAll('#punnett-result').forEach(el=>el.innerHTML=punnettResult())}
function hardyResult(){const p=hardyP,q=1-p;let rows=[['AA',p*p],['Aa',2*p*q],['aa',q*q]];return `<div class="panel soft"><div class="row between wrap small muted" style="margin-bottom:15px"><span>p = <b>${p.toFixed(2)}</b></span><span>q = <b>${q.toFixed(2)}</b></span><span>p + q = 1</span></div><div class="bars">${rows.map(([name,n])=>`<div class="barrow"><b>${name}</b><div class="bar"><i style="width:${(n*100).toFixed(1)}%"></i></div><b>${(100*n).toFixed(1)}%</b></div>`).join('')}</div><div class="small muted" style="margin-top:14px">Model assumptions: large random-mating population, no selection, mutation or migration, and negligible genetic drift.</div></div>`}
function drawHardy(){const x=e('hardy-result');if(x)x.innerHTML=hardyResult();const v=e('hardyval');if(v)v.textContent=hardyP.toFixed(2)}
function mapResult(){if(!Number.isFinite(mapTotal)||mapTotal<=0||mapR<0||!Number.isFinite(mapR)||mapR>mapTotal)return '<div class="notice">Enter valid nonnegative recombinant counts no greater than total offspring.</div>';const pct=100*mapR/mapTotal;return `<div class="panel soft"><span class="small muted">Observed recombination</span><div class="score accent">${pct.toFixed(2)}%</div><b>≈ ${pct.toFixed(2)} cM ${pct<=20?'(short-distance approximation)':''}</b><p class="small" style="margin-top:10px">${pct>50?'⚠ In a standard two-locus testcross, observed recombination should not systematically exceed 50%. Recheck your class labels/data.':pct>20?'⚠ For longer genetic intervals, double crossovers can make observed recombination underestimate map distance.':'This approximation is most useful for short genetic intervals.'}</p></div>`}
function drawMap(){const x=e('map-result');if(x)x.innerHTML=mapResult()}
function initDeck(scope=deckScope){flashResults=[];deckScope=scope;const now=Date.now();deck=[];MODULES.forEach((m,i)=>{if(typeof flashWeek==='number'&&flashWeek!==i)return;m.terms.forEach((card,j)=>{const meta=state.flash[k(i,j)]||{};if(deckScope==='all'||!meta.due||meta.due<=now)deck.push([i,j])})});deck.sort((a,b)=>a[0]-b[0]);deckPos=0;flipped=false}
let flashWeek=null;
function openFlashcards(i){flashWeek=i;deckScope='all';navigate('flashcards')}
function flashcardsPage(){const total=MODULES.reduce((n,m)=>n+m.terms.length,0);return `<div class="row between wrap"><div><span class="eyebrow">FLASHCARD REVIEW</span><h1 style="margin:8px 0">Flashcards</h1><p><b>Step 1:</b> Read the term and recall its definition. <b>Step 2:</b> Tap the card to check. <b>Step 3:</b> Rate how well you remembered it using <b>Again</b>, <b>Good</b>, or <b>Easy</b>.</p></div><div class="toolbar"><select aria-label="Select flashcard module" style="width:auto" onchange="flashWeek=this.value==='all'?null:Number(this.value);initDeck();render()"><option value="all" ${flashWeek===null?'selected':''}>All weeks</option>${MODULES.map((m,i)=>`<option value="${i}" ${flashWeek===i?'selected':''}>Week ${i+1}</option>`).join('')}</select><select aria-label="Flashcard filter" style="width:auto" onchange="deckScope=this.value;initDeck();render()"><option value="due" ${deckScope==='due'?'selected':''}>New + due</option><option value="all" ${deckScope==='all'?'selected':''}>All cards</option></select></div></div><div class="panel studydeck" style="margin-top:21px"><div class="row between wrap"><span class="pill">${deck.length?Math.min(deckPos+1,deck.length):0} / ${deck.length} cards</span><span class="small muted">${Object.keys(state.flash).length} / ${total} reviewed at least once</span></div>${flashCardBody()}</div><div class="notice studydeck" style="margin-top:18px"><b>Choose after revealing the definition:</b> <b>Again</b> = I did not remember (review tomorrow). <b>Good</b> = I remembered, perhaps with effort (review in a few days). <b>Easy</b> = I knew it immediately (review after a longer break). Each button shows the exact time until the next review. This is <b>spaced repetition</b>—remembered cards appear less often; difficult cards return sooner. New cards also appear under “New + due.” Your progress stays on this device unless you export it.</div>`}
function nextReviewDays(rate,previousInterval=1){return rate==='again'?1:rate==='easy'?Math.min(90,Math.max(4,Math.round(previousInterval*2.6))):Math.min(60,Math.max(2,Math.round(previousInterval*1.9)))}
function reviewDelay(days){return days===1?'tomorrow':'in '+days+' days'}
function flashCardBody(){if(deckPos>=deck.length){const counts={again:0,good:0,easy:0};flashResults.forEach(x=>counts[x.rate]++);return `<div class="empty"><h2>✓ Review complete</h2><p>${flashResults.length} cards reviewed · ${counts.again} to relearn · ${counts.good} remembered · ${counts.easy} easy</p><p>Missed cards return tomorrow. Remembered cards return after their spaced intervals.</p><button class="btn secondary" onclick="deckScope='due';initDeck();render()">Check new + due →</button><button class="btn ghost" onclick="deckScope='all';initDeck();render()">Review all →</button></div>`}return `<div class="empty"><h2>✓ Deck complete</h2><p>You have completed all selected cards. Switch to “All cards” to review again, or come back when cards are due.</p><button class="btn secondary" onclick="deckScope='all';initDeck();render()">Review all →</button></div>`;const [i,j]=deck[deckPos],card=MODULES[i].terms[j],previousInterval=state.flash[k(i,j)]?.interval||1;return `<div class="row between small muted" style="margin:15px 0"><span>WEEK ${i+1} · ${h(MODULES[i].title)}</span><span>${flipped?'Definition revealed':'Recall the definition'}</span></div><div class="flashcard" role="button" tabindex="0" onclick="flipped=!flipped;render()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipped=!flipped;render()}"><span class="hint">${flipped?'DEFINITION':'TAP TO CHECK ANSWER'}</span><div class="term">${h(card[0])}</div>${flipped?`<div class="definition">${h(card[1])}</div>`:'<div class="small muted" style="margin-top:20px">What does this mean?</div>'}</div><div class="studyactions">${flipped?`<button class="btn secondary" onclick="rateCard('again')">Again · tomorrow</button><button class="btn" onclick="rateCard('good')">Good · ${reviewDelay(nextReviewDays('good',previousInterval))}</button><button class="btn ghost" onclick="rateCard('easy')">Easy · ${reviewDelay(nextReviewDays('easy',previousInterval))}</button>`:`<button class="btn" onclick="flipped=true;render()">Reveal definition</button>`}</div>`}
function rateCard(rate){if(deckPos>=deck.length)return;const [i,j]=deck[deckPos],id=k(i,j),old=state.flash[id]||{},n=old.n||0,interval=nextReviewDays(rate,old.interval||1);state.flash[id]={n:n+1,interval,rate,due:Date.now()+interval*86400000};flashResults.push({id,rate,interval});save();deckPos++;flipped=false;render()}
function resourcesPage(){const all=MODULES.flatMap((m,i)=>m.lessons.map(l=>({...l,i})));return `<span class="eyebrow">VIDEO & REFERENCE LIBRARY</span><h1 style="margin:8px 0">All learning resources</h1><p class="maxtext">${all.length} publisher-hosted video lessons, collections and simulations selected to support genetics preparation. Links open the original sources; some platforms may ask you to sign in.</p><div class="panel" style="margin-top:20px">${MODULES.map((m,i)=>`<section><h3 style="margin:21px 0 7px"><span class="weeknum">${i+1}</span> ${h(m.title)}</h3>${m.lessons.map(l=>`<div class="list-resource"><div><a href="${h(l.url)}" target="_blank" rel="noopener noreferrer">${h(l.title)} ↗</a><div class="small muted">${h(l.source)} · ${l.yt?'Video':'External lesson / media resource'} · approx. ${l.minutes} min</div></div><button class="btn sm secondary" onclick="navigate('module',${i})">Week ${i+1}</button></div>`).join('')}</section>`).join('')}</div><section class="section panel soft"><h3>Course alignment and supplemental text</h3><p>Official description: UNL BIOS 201 <i>General Genetics</i> (4 credit hours) covers inheritance and regulation of genes in organisms and populations, genomics and bioinformatics.</p><div class="toolbar"><a class="btn sm secondary" href="https://catalog.unl.edu/undergraduate/courses/bios/" target="_blank" rel="noopener noreferrer">UNL catalog ↗</a><a class="btn sm secondary" href="https://ocw.mit.edu/courses/res-7-006-7-03x-genetics/" target="_blank" rel="noopener noreferrer">MIT OCW Genetics ↗</a><a class="btn sm secondary" href="https://www.khanacademy.org/ap-biology/" target="_blank" rel="noopener noreferrer">Khan Academy Biology ↗</a></div></section>${footnote()}`}
function settingsPage(){return `<span class="eyebrow">PERSONALIZE AND SHARE</span><h1 style="margin:8px 0">Settings & progress</h1><p>Everything in this app is stored locally in the browser on each device. A published website URL is shareable, but progress does not automatically sync between users or devices.</p><div class="grid twocol" style="margin-top:22px"><section class="panel"><h2>Share this app</h2><p>Once hosted, send the site link to anyone. They will start with their own fresh progress.</p><div class="toolbar"><button class="btn" onclick="shareSite()">↗ Share / copy link</button><button class="btn secondary" onclick="installHelp()">Install on device</button></div></section><section class="panel"><h2>Appearance</h2><p>Choose the theme that works best for you.</p><div class="toolbar"><button class="btn secondary" onclick="setTheme('dark')">☾ Dark</button><button class="btn secondary" onclick="setTheme('light')">☼ Light</button></div></section><section class="panel"><h2>Save / restore progress</h2><p>Export your watched lessons, quiz scores, flashcard schedule and private study notes as a JSON backup. Import it on another device to move your progress.</p><div class="toolbar"><button class="btn" onclick="exportProgress()">↓ Export progress</button><label class="btn secondary clickable" for="importfile">↑ Import backup</label><input type="file" id="importfile" accept=".json,application/json" hidden onchange="importProgress(this.files[0]);this.value=''" /></div></section><section class="panel"><h2>Reset your progress</h2><p>This action clears saved quizzes, flashcards, lesson completion and notes on this device.</p><button class="btn danger" onclick="resetProgress()">Reset all progress</button></section></div><section class="panel soft section"><h3>Privacy and technical details</h3><p>There are no analytics, user accounts, custom servers, cookies or external libraries. JavaScript and CSS are self-contained. Video content streams from external publishers only when you choose to play/open a lesson. The curriculum and quiz/lab interactions work without internet after the app is loaded; videos require a connection.</p><p class="small">Educational preparation resource, independently authored, not an official University of Nebraska–Lincoln course and not a substitute for the current instructor's syllabus.</p></section>`}
function footnote(){return `<div class="footer-note">BIOS 201 Genetics Launchpad · Independent study resource · Align your preparation with your instructor’s current syllabus. Course description: <a href="https://catalog.unl.edu/undergraduate/courses/bios/" target="_blank" rel="noopener noreferrer">UNL catalog ↗</a></div>`}
function render(){drawNav();e('crumb').textContent=page==='module'?'UNL / BIOS 201 / WEEK '+(week+1):'UNL / BIOS 201 / '+page.toUpperCase();let html=page==='dashboard'?dashboard():page==='modules'?modulesPage():page==='module'?modulePage():page==='flashcards'?flashcardsPage():page==='labs'?labsPage():page==='resources'?resourcesPage():settingsPage();e('content').innerHTML=html;document.documentElement.setAttribute('data-theme',state.theme||'dark');e('themebtn').textContent=state.theme==='light'?'☾':'☼'}
function setTheme(t){state.theme=t;save();render()}
function toggleTheme(){setTheme(state.theme==='dark'?'light':'dark')}
async function shareSite(){let url=location.href.split('#')[0];try{if(navigator.share&&location.protocol!=='file:'){await navigator.share({title:'BIOS 201 Genetics Launchpad',text:'Interactive 8-week genetics prep curriculum',url});return}if(navigator.clipboard&&location.protocol==='https:'){await navigator.clipboard.writeText(url);notify('Website link copied!');return}}catch(err){if(err.name==='AbortError')return}try{const el=document.createElement('textarea');el.value=url;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();notify(location.protocol==='file:'?'Local file path copied; publish for a shareable web link.':'Website link copied!')}catch(err){prompt('Copy this link:',url)}}
function installHelp(){notify('iPhone: Safari → Share → Add to Home Screen. Android: browser menu → Install app. Mac: Safari → File → Add to Dock. Use the hosted URL.')}
function exportProgress(){const blob=new Blob([JSON.stringify({app:'bios201-genetics-launchpad',exportedAt:new Date().toISOString(),progress:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BIOS201-progress-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('Progress backup created')}
async function importProgress(file){if(!file)return;try{if(file.size>1000000)throw Error('Backup is too large.');let parsed=JSON.parse(await file.text());if(parsed.app!=='bios201-genetics-launchpad'||!parsed.progress||typeof parsed.progress!=='object')throw Error('This is not a BIOS 201 backup.');if(!confirm('Import this backup? It will replace the progress saved on this device.'))return;let x=parsed.progress;state={...DEFAULT,...x,quizLast:x.quizLast||{},watched:x.watched||{},tasks:x.tasks||{},best:x.best||{},attempts:x.attempts||{},flash:x.flash||{},notes:x.notes||{},sessions:x.sessions||[]};save();navigate('dashboard');notify('Progress restored from backup')}catch(err){alert('Could not import progress: '+err.message)}}
function resetProgress(){if(!confirm('Reset ALL saved progress and notes on this device? This cannot be undone unless you have exported a backup.'))return;let t=state.theme;state=structuredClone(DEFAULT);state.theme=t;save();navigate('dashboard');notify('Progress reset')}
window.addEventListener('hashchange',syncHash);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
syncHash();
</script></body></html>
